name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    env:
      APP_MODE: offline
      LANGSMITH_TRACING: "false"
      OTEL_SDK_DISABLED: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.13.8
          uv sync --locked
      - name: Check generated requirements
        run: |
          uv export --frozen --no-dev --no-emit-project --no-header --format requirements-txt --output-file requirements.txt > /dev/null
          git diff --exit-code -- requirements.txt
      - name: Formatting and lint
        run: |
          uv run ruff format --check src tests scripts
          uv run ruff check src tests scripts
      - name: Strict types
        run: uv run mypy src/retail_agent
      - name: Tests without cloud credentials or network
        run: uv run pytest --cov=retail_agent --cov-report=term-missing --cov-fail-under=85
      - name: Static security and secret checks
        run: |
          uv run bandit -c pyproject.toml -r src
          uv run python scripts/check_secrets.py
      - name: Dependency audit
        if: matrix.python == '3.12'
        run: uv run pip-audit --strict --disable-pip -r requirements.txt
      - name: Build and verify wheel installation
        run: |
          uv build
          uv venv .smoke
          uv pip install --python .smoke/bin/python --constraint requirements.txt dist/*.whl
          .smoke/bin/retail-agent --help
          .smoke/bin/retail-agent doctor
          .smoke/bin/retail-agent demo
