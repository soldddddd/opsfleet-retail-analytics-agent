[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "opsfleet-retail-agent"
version = "0.1.0"
description = "A local, scoped retail analysis CLI using Gemini and BigQuery"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "duckdb>=1.4,<2",
  "google-cloud-bigquery>=3.38,<4",
  "google-genai>=1.50,<2",
  "langgraph>=1.0,<2",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.11,<3",
  "PyJWT[crypto]>=2.10,<3",
  "rich>=14,<15",
  "sqlglot>=28,<31",
  "typer>=0.20,<1",
  "opentelemetry-api>=1.38,<2",
  "opentelemetry-sdk>=1.38,<2",
]

[project.scripts]
retail-agent = "retail_agent.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.4,<10", "pytest-cov>=7,<8", "pytest-socket>=0.7,<1",
  "hypothesis>=6.140,<7", "ruff>=0.14,<1", "mypy>=1.18,<2",
  "pip-audit>=2.9,<3", "bandit>=1.8,<2", "build>=1.3,<2",
  "detect-secrets>=1.5,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/retail_agent"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/config", "/tests", "/scripts", "/docs", "/README.md",
  "/pyproject.toml", "/requirements.txt", "/uv.lock", "/.env.example",
  "/.gitignore", "/.github/workflows/ci.yml",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/retail_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --disable-socket -m 'not live'"
markers = ["live: explicit opt-in tests using real cloud credentials and quota"]

[tool.coverage.run]
branch = true
source = ["retail_agent"]

[tool.coverage.report]
show_missing = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
